version: 2

updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
      timezone: America/Detroit
    open-pull-requests-limit: 3

    # Exact pins preserve the tested environment. Updates stay reviewable
    # and must pass the committed numerical and data-integrity baseline.
    versioning-strategy: increase-if-necessary

    groups:
      python-dependencies:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

    ignore:
      # Major upgrades require a deliberate environment/baseline review.
      - dependency-name: "*"
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      timezone: America/Detroit
    open-pull-requests-limit: 3
    groups:
      routine-action-updates:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
